# Smart Load Manager OJM beta.11 — standalone example view (built-in cards only).
# Forbruksgrense uses the known site budget entity ID. Device-specific entities
# vary by charger name; replace those IDs with the entity picker results once.
type: sections
title: Bil — Smart laststyring
path: smart-lading
max_columns: 2
sections:
  - type: grid
    cards:
      - type: entities
        title: Lade- og styringskontroller
        show_header_toggle: false
        state_color: true
        entities:
          - entity: switch.smart_load_manager_ojm_easee_automatisk_laststyring
            name: Automatisk laststyring (av som standard)
          - entity: switch.smart_load_manager_ojm_easee_tidsstyring
            name: Tidsstyring (på/av)
          - entity: time.smart_load_manager_ojm_easee_starttid_for_lading
            name: Starttid for 12-timersvindu
          - entity: number.smart_load_manager_ojm_easee_manuell_ladestr_m
            name: Manuell ladestrøm (bruk når automatikken er av; 0 A = pause)
          - entity: select.smart_load_manager_ojm_easee_fasevalg
            name: Fasevalg (automatisk / én / tre faser)
          - entity: sensor.smart_load_manager_ojm_easee_anbefalt_strom
            name: Anbefalt ladestrøm
          - entity: sensor.smart_load_manager_ojm_easee_min_ladestr_m
            name: Nedre grense for aktiv ladeform
          - entity: sensor.smart_load_manager_ojm_easee_maks_strom_fra_easee
            name: Maksimal strøm fra Easee
          - entity: sensor.smart_load_manager_ojm_easee_hvorfor_denne_styringen
            name: Hvorfor denne anbefalingen?
          - entity: sensor.smart_load_manager_ojm_easee_han_alder
            name: Alder på HAN-måling (sekunder)
          - entity: sensor.smart_load_manager_ojm_easee_han_gyldig
            name: HAN-data gyldige?
          - entity: sensor.smart_load_manager_ojm_easee_tidsstyring_status
            name: Tidsvindu status
  - type: grid
    cards:
      - type: entities
        title: Lader — målt status og elektriske data
        show_header_toggle: false
        entities:
          - entity: sensor.smart_load_manager_ojm_easee_laderstatus
          - entity: sensor.smart_load_manager_ojm_easee_fasemodus_rapportert
            name: Valgt modus (Auto / 1 / 3 faser)
          - entity: sensor.smart_load_manager_ojm_easee_utgangsfase
            name: Easee utgangsfase (dekodet)
          - entity: sensor.smart_load_manager_ojm_easee_aktive_faser
          - entity: sensor.smart_load_manager_ojm_easee_nettype
          - entity: sensor.smart_load_manager_ojm_easee_detektert_spenningssystem
          - entity: sensor.smart_load_manager_ojm_easee_linjespenning
          - entity: sensor.smart_load_manager_ojm_easee_fase_noytral_spenning
          - entity: sensor.smart_load_manager_ojm_easee_ladeeffekt
          - entity: sensor.smart_load_manager_ojm_easee_easee_begrensning
  - type: grid
    cards:
      - type: entities
        title: Huslast og timebudsjett
        show_header_toggle: false
        entities:
          - entity: sensor.smart_load_manager_ojm_easee_huseffekt_han
          - entity: sensor.smart_load_manager_ojm_easee_brukt_denne_timen
          - entity: sensor.smart_load_manager_ojm_easee_timeestimat
          - entity: select.smart_load_manager_ojm_easee_forbruksgrense
            name: Forbruksgrense — felles grense (kWh per klokketime)
          - entity: sensor.smart_load_manager_ojm_easee_deteksjonssikkerhet
          - entity: sensor.smart_load_manager_ojm_easee_grunnlag_for_deteksjon
      - type: history-graph
        title: Lading og timebudsjett — siste 3 timer
        hours_to_show: 3
        entities:
          - entity: sensor.smart_load_manager_ojm_easee_anbefalt_strom
            name: Anbefalt A
          - entity: number.smart_load_manager_ojm_easee_manuell_ladestr_m
            name: Dynamisk grense A
          - entity: sensor.smart_load_manager_ojm_easee_huseffekt_han
            name: HAN W
          - entity: sensor.smart_load_manager_ojm_easee_ladeeffekt
            name: Lader W
          - entity: sensor.energy_used_this_hour
            name: EnergyTariff brukt
          - entity: sensor.smart_load_manager_ojm_easee_timeestimat
            name: EnergyTariff estimat (Smart Load Manager-sensor)
