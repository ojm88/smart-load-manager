name: Tests

on:
  push:
  pull_request:

jobs:
  logo-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate packaged read-only picker experiment
        run: |
          node --check custom_components/smart_load_manager/frontend/logo-picker-probe.mjs
          node --test experiments/logo-picker/test-probe.mjs
          cmp experiments/logo-picker/logo-picker-probe.mjs custom_components/smart_load_manager/frontend/logo-picker-probe.mjs
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pure calculation regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration modules
        run: python -m compileall -q custom_components
      - name: Validate JSON metadata
        run: |
          python -m json.tool custom_components/smart_load_manager/manifest.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/strings.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/translations/nb.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  config-flow-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2026.2.3"
          - python: "3.14"
            homeassistant: "2026.10.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant runtime
        run: python -m pip install homeassistant==${{ matrix.homeassistant }} pyyaml
      - name: Test diagnostic sensor payload compatibility
        run: PYTHONPATH=custom_components python -m unittest discover -s ha_tests -p 'test_*runtime.py' -v
      - name: Import config flow in Home Assistant runtime
        run: >-
          PYTHONPATH=custom_components python -c 'from smart_load_manager import config_flow, entity_ids, number, select, sensor, switch; from smart_load_manager import time as time_platform; from homeassistant.helpers import selector; from homeassistant.components.time import TimeEntity; from homeassistant.components.select import SelectEntity; from homeassistant.components.number import NumberEntity; from homeassistant.components.sensor import SensorEntity; assert config_flow.selector is selector; assert issubclass(select.ConsumptionLimitSelect, SelectEntity); assert issubclass(number.ChargingCurrentLimit, NumberEntity); assert issubclass(sensor.ChargingDiagnosticSensor, SensorEntity); assert issubclass(time_platform.ChargingScheduleStartTime, TimeEntity); assert hasattr(switch, "ChargingScheduleControl"); assert hasattr(switch, "ChargingPauseControl"); assert entity_ids.suggested_entity_id("switch", "charging_pause") == "slm_charging_pause"; assert entity_ids.suggested_entity_id("sensor", "status") == "slm_charger_status"'
