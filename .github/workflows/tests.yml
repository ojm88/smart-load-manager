name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pure calculation regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration modules
        run: python -m compileall -q custom_components
      - name: Validate JSON metadata
        run: |
          python -m json.tool custom_components/smart_load_manager/manifest.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/strings.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/translations/nb.json >/dev/null
          python -m json.tool custom_components/smart_load_manager/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  config-flow-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Home Assistant runtime
        run: python -m pip install homeassistant
      - name: Import config flow in Home Assistant runtime
        run: >-
          PYTHONPATH=custom_components python -c 'from smart_load_manager import config_flow, select, switch; from smart_load_manager import time as time_platform; from homeassistant.helpers import selector; from homeassistant.components.time import TimeEntity; from homeassistant.components.select import SelectEntity; assert config_flow.selector is selector; assert issubclass(select.ConsumptionLimitSelect, SelectEntity); assert issubclass(time_platform.ChargingScheduleStartTime, TimeEntity); assert hasattr(switch, "ChargingScheduleControl")' 
