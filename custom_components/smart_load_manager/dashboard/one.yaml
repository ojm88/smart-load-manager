# Manual card. Run smart_load_manager.get_dashboard for your registered entity IDs.
type: vertical-stack
cards:
- type: markdown
  content: '{% set info = ''sensor.slm_status'' %}

    {% set loads = state_attr(info, ''controlled_loads'') or [] %}

    {% set groups = state_attr(info, ''load_groups'') or [{''name'': ''Lading'', ''loads'': loads, ''empty_message'':
    ''''}] %}

    {% set power = state_attr(info, ''han_power_w'') %}

    {% set used = state_attr(info, ''energy_used_kwh'') %}

    {% set estimate = state_attr(info, ''energy_estimate_kwh'') %}

    {% macro amount(value, unit, divisor=1) -%}

    {% if value is number -%}

    {% set scaled = value / divisor -%}

    {{ (scaled | round(0) | int) if scaled | abs >= 100 else (scaled | round(1)) }}&nbsp;{{ unit }}

    {%- else -%}—{%- endif %}

    {%- endmacro %}

    **Boligen**


    <table><thead><tr><th>⚡ Måler</th><th>✅ Brukt</th><th>🔄 Est.</th></tr></thead><tbody><tr><td><b>{{
    amount(power, ''kW'', 1000) }}</b></td><td><b>{{ amount(used, ''MWh'' if used is number and used >=
    1000 else ''kWh'', 1000 if used is number and used >= 1000 else 1) }}</b></td><td><b>{{ amount(estimate,
    ''MWh'' if estimate is number and estimate >= 1000 else ''kWh'', 1000 if estimate is number and estimate
    >= 1000 else 1) }}</b></td></tr></tbody></table>


    {% if state_attr(info, ''han_fresh'') == false %}


    ⚠️ HAN-målingen er ikke oppdatert. Avventer nye målinger.


    {% endif %}


    {% if states(info) in [''unknown'', ''unavailable''] or not loads %}

    ℹ️ Opplysninger om laststyringen er ikke tilgjengelige akkurat nå.

    {% else %}

    Grense: **{{ state_attr(info, ''consumption_limit_kwh'') }} kWh denne timen**.

    {% for group in groups %}

    {% if not loop.first %}


    ---


    {% endif %}

    **{{ group.name }}**

    {% if group.empty_message %}

    {{ group.empty_message }}.

    {% else %}

    {% for load in group.loads %}


    {{ load.name }} · **{{ load.status_label | default(''Venter'') }}**{% if load.mode_label | default('''')
    %} · {{ load.mode_label }}{% endif %}

    {% if load.detail | default('''') %}


    {{ load.detail }}

    {% endif %}

    {% if load.show_charging_details | default(load.status == ''charging'') %}


    Effekt: **{{ amount(load.power_w, ''kW'', 1000) }}**.

    {% if load.automatic_control and load.recommended_current_a is number %}

    {% if load.last_sent_current_a is number and load.recommended_current_a != load.last_sent_current_a
    %}

    Anbefalt: **{{ load.recommended_current_a | round(0) | int }} A** · Satt: **{{ load.last_sent_current_a
    | round(0) | int }} A**.

    {% else %}

    Strømgrense: **{{ load.recommended_current_a | round(0) | int }} A**.

    {% endif %}

    {% if load.next_regulation_at is number %}

    Regulering: **{{ load.next_regulation_at | timestamp_custom(''%H:%M'', true) }}**.

    {% endif %}

    {% elif load.last_sent_current_a is number %}

    Manuell grense: **{{ load.last_sent_current_a | round(0) | int }} A**.

    {% endif %}

    {% endif %}

    {% endfor %}

    {% endif %}

    {% endfor %}

    {% if state_attr(info, ''phase_advice'') %}


    💡 {{ state_attr(info, ''phase_advice'') }}

    {% endif %}

    {% endif %}

    '
- type: entities
  title: SLM – Boligen
  show_header_toggle: false
  entities:
  - entity: select.smart_load_manager_ojm_easee_forbruksgrense
    name: Forbruksgrense for hele boligen
- type: entities
  title: Styr ladingen
  show_header_toggle: false
  entities:
  - entity: switch.slm_auto_control_FIRST_CHARGER_SUFFIX
    name: Automatisk laststyring
  - entity: switch.slm_charging_pause_FIRST_CHARGER_SUFFIX
    name: Ladepause
  - entity: select.slm_phase_mode_FIRST_CHARGER_SUFFIX
    name: Fasevalg
  - entity: number.slm_manual_current_FIRST_CHARGER_SUFFIX
    name: Manuell ladestrøm (brukes når automatisk styring er av)
  - entity: switch.slm_schedule_FIRST_CHARGER_SUFFIX
    name: Tidsstyring
  - entity: time.slm_charge_start_FIRST_CHARGER_SUFFIX
    name: Starttid
- type: entities
  title: Laderen og målingene
  show_header_toggle: false
  entities:
  - entity: sensor.slm_charger_status_FIRST_CHARGER_SUFFIX
    name: Ladestatus
  - entity: sensor.slm_charger_current_FIRST_CHARGER_SUFFIX
    name: Strøm til bilen
  - entity: sensor.slm_charger_power_FIRST_CHARGER_SUFFIX
    name: Ladeeffekt
  - entity: sensor.slm_recommended_current_FIRST_CHARGER_SUFFIX
    name: Anbefalt ladestrøm
  - entity: sensor.slm_active_phases_FIRST_CHARGER_SUFFIX
    name: Faser i bruk
  - entity: sensor.slm_line_voltage_FIRST_CHARGER_SUFFIX
    name: Volt
- type: entities
  title: Boligens målinger
  show_header_toggle: false
  entities:
  - entity: sensor.SLM_HAN_POWER_SOURCE
    name: Effekt fra strømmåleren
  - entity: sensor.energy_used_this_hour
    name: Forbruk hittil denne timen
  - entity: sensor.energy_estimate_this_hour
    name: Forventet forbruk denne timen
  - entity: sensor.slm_measurement_status
    name: Målegrunnlag
- type: history-graph
  title: Lading og strømforbruk – siste 12 timer
  hours_to_show: 12
  entities:
  - entity: sensor.slm_recommended_current_FIRST_CHARGER_SUFFIX
    name: Anbefalt strøm
  - entity: sensor.energy_used_this_hour
    name: Brukt
  - entity: sensor.slm_charger_current_FIRST_CHARGER_SUFFIX
    name: Målt ladestrøm
  - entity: sensor.energy_estimate_this_hour
    name: Timeestimat
  - entity: sensor.average_peak_hour_energy
    name: Snitt 3-timer
