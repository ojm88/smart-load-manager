# Manual card. Run smart_load_manager.get_dashboard for your registered entity IDs.
type: vertical-stack
cards:
- type: markdown
  content: '{% set info = ''sensor.slm_status'' %}

    {% set loads = state_attr(info, ''controlled_loads'') or [] %}


    {% set power = state_attr(info, ''han_power_w'') %}

    {% set used = state_attr(info, ''energy_used_kwh'') %}

    {% set estimate = state_attr(info, ''energy_estimate_kwh'') %}

    {% macro amount(value, unit, divisor=1) -%}

    {% if value is number -%}

    {% set scaled = value / divisor -%}

    {{ (scaled | round(0) | int) if scaled | abs >= 100 else (scaled | round(1)) }}&nbsp;{{ unit }}

    {%- else -%}—{%- endif %}

    {%- endmacro %}

    {% set disconnected = loads | selectattr(''status'', ''equalto'', ''disconnected'') | list %}

    {% set connected = loads | selectattr(''status'', ''in'', [''awaiting_start'', ''charging'', ''ready_to_charge'',
    ''completed'', ''start_charging'', ''awaiting_load_balancing'', ''awaiting_authorization'']) | list
    %}

    {% if loads and disconnected | length == loads | length %}

    ### {{ ''Ingen bil tilkoblet'' if loads | length == 1 else ''Ingen biler tilkoblet'' }}

    {% else %}

    {% if loads | length > 1 and connected | length + disconnected | length == loads | length %}

    ### {{ connected | length }} av {{ loads | length }} biler tilkoblet

    {% else %}

    ### Ladestatus

    {% endif %}

    {% endif %}

    <table><thead><tr><th>⚡ Måler</th><th>✅ Brukt</th><th>🔄 Est.</th></tr></thead><tbody><tr><td><b>{{
    amount(power, ''kW'', 1000) }}</b></td><td><b>{{ amount(used, ''MWh'' if used is number and used >=
    1000 else ''kWh'', 1000 if used is number and used >= 1000 else 1) }}</b></td><td><b>{{ amount(estimate,
    ''MWh'' if estimate is number and estimate >= 1000 else ''kWh'', 1000 if estimate is number and estimate
    >= 1000 else 1) }}</b></td></tr></tbody></table>


    {% if states(info) in [''unknown'', ''unavailable''] or not loads %}

    ℹ️ **Opplysninger om laststyringen er ikke tilgjengelige akkurat nå.**

    {% else %}

    {% if disconnected | length != loads | length %}

    **{{ state_attr(info, ''summary'') }}**

    {% endif %}


    Forbruksgrensen for hele boligen er **{{ state_attr(info, ''consumption_limit_kwh'') }} kWh denne
    timen**.

    {% if state_attr(info, ''distribution_explanation'') and loads | rejectattr(''status'', ''equalto'',
    ''disconnected'') | list | length > 1 %}


    {{ state_attr(info, ''distribution_explanation'') }}

    Førsteprioritet: **{{ state_attr(info, ''priority_charger'') }}**.

    {% endif %}

    {% for load in loads %}

    {% if disconnected | length != loads | length %}


    ### {{ load.name }} – {{ load.status_label | default(''Venter'') }}

    {% if load.status in [''awaiting_start'', ''charging'', ''ready_to_charge'', ''completed'', ''charged'',
    ''awaiting_authentication''] %}


    🔌 Bilen er koblet til.


    {% endif %}


    {% if load.status != ''disconnected'' %}

    {{ load.explanation }}

    {% endif %}


    {% if load.status == ''charging'' %}

    {% if load.power_w is not none %}

    Ladeeffekt: **{{ load.power_w | round(0) | int }} W**.

    {% endif %}

    {% if load.automatic_control and load.recommended_current_a is not none %}

    Anbefalt nå: **{{ load.recommended_current_a | round(0) | int }} A**{% if load.last_sent_current_a
    is number %} · Sist satt: **{{ load.last_sent_current_a | round(0) | int }} A**{% endif %}.


    {% if load.next_regulation_at is number %}

    Neste ordinære regulering: **{{ load.next_regulation_at | timestamp_custom(''%H:%M'', true) }}**.

    {% endif %}

    {% endif %}

    {% endif %}

    {% endif %}

    {% endfor %}

    {% if state_attr(info, ''phase_advice'') %}


    💡 {{ state_attr(info, ''phase_advice'') }}

    {% endif %}

    {% endif %}'
- type: entities
  title: SLM – Boligen
  show_header_toggle: false
  entities:
  - entity: select.smart_load_manager_ojm_easee_forbruksgrense
    name: Forbruksgrense for hele huset
  - entity: select.slm_charging_mode
    name: Lademåte
- type: entities
  title: Styring – første lader
  show_header_toggle: false
  entities:
  - entity: switch.slm_auto_control_FIRST_CHARGER_SUFFIX
    name: Automatisk laststyring
  - entity: switch.slm_charging_pause_FIRST_CHARGER_SUFFIX
    name: Ladepause
  - entity: select.slm_phase_mode_FIRST_CHARGER_SUFFIX
    name: Fasevalg
  - entity: number.slm_manual_current_FIRST_CHARGER_SUFFIX
    name: Manuell ladestrøm (brukes når automatisk styring er av)
  - entity: switch.slm_schedule_FIRST_CHARGER_SUFFIX
    name: Tidsstyring
  - entity: time.slm_charge_start_FIRST_CHARGER_SUFFIX
    name: Starttid
  - entity: switch.slm_priority_FIRST_CHARGER_SUFFIX
    name: Førsteprioritet
- type: entities
  title: Målinger – første lader
  show_header_toggle: false
  entities:
  - entity: sensor.slm_charger_status_FIRST_CHARGER_SUFFIX
