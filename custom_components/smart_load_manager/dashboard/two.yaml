  - entity: sensor.slm_charger_current_FIRST_CHARGER_SUFFIX
    name: Strøm til bilen
  - entity: sensor.slm_charger_power_FIRST_CHARGER_SUFFIX
    name: Ladeeffekt
  - entity: sensor.slm_recommended_current_FIRST_CHARGER_SUFFIX
    name: Anbefalt ladestrøm
  - entity: sensor.slm_active_phases_FIRST_CHARGER_SUFFIX
    name: Faser i bruk
  - entity: sensor.slm_line_voltage_FIRST_CHARGER_SUFFIX
    name: Volt
- type: entities
  title: Styring – ny lader
  show_header_toggle: false
  entities:
  - entity: switch.slm_auto_control_CHARGER_SUFFIX
    name: Automatisk laststyring
  - entity: switch.slm_charging_pause_CHARGER_SUFFIX
    name: Ladepause
  - entity: select.slm_phase_mode_CHARGER_SUFFIX
    name: Fasevalg
  - entity: number.slm_manual_current_CHARGER_SUFFIX
    name: Manuell ladestrøm (brukes når automatisk styring er av)
  - entity: switch.slm_schedule_CHARGER_SUFFIX
    name: Tidsstyring
  - entity: time.slm_charge_start_CHARGER_SUFFIX
    name: Starttid
  - entity: switch.slm_priority_CHARGER_SUFFIX
    name: Førsteprioritet
- type: entities
  title: Målinger – ny lader
  show_header_toggle: false
  entities:
  - entity: sensor.slm_charger_status_CHARGER_SUFFIX
    name: Ladestatus
  - entity: sensor.slm_charger_current_CHARGER_SUFFIX
    name: Strøm til bilen
  - entity: sensor.slm_charger_power_CHARGER_SUFFIX
    name: Ladeeffekt
  - entity: sensor.slm_recommended_current_CHARGER_SUFFIX
    name: Anbefalt ladestrøm
  - entity: sensor.slm_active_phases_CHARGER_SUFFIX
    name: Faser i bruk
  - entity: sensor.slm_line_voltage_CHARGER_SUFFIX
    name: Volt
- type: entities
  title: Boligens målinger
  show_header_toggle: false
  entities:
  - entity: sensor.SLM_HAN_POWER_SOURCE
    name: Effekt fra strømmåleren
  - entity: sensor.energy_used_this_hour
    name: Forbruk hittil denne timen
  - entity: sensor.energy_estimate_this_hour
    name: Forventet forbruk denne timen
  - entity: sensor.slm_measurement_status
    name: Målegrunnlag
- type: history-graph
  title: Lading og strømforbruk – siste 12 timer
  hours_to_show: 12
  entities:
  - entity: sensor.slm_recommended_current_FIRST_CHARGER_SUFFIX
    name: Anbefalt strøm
  - entity: sensor.energy_used_this_hour
    name: Brukt
  - entity: sensor.slm_charger_current_FIRST_CHARGER_SUFFIX
    name: Målt ladestrøm
  - entity: sensor.energy_estimate_this_hour
    name: Timeestimat
  - entity: sensor.average_peak_hour_energy
    name: Snitt 3-timer
  - entity: sensor.slm_recommended_current_CHARGER_SUFFIX
    name: Anbefalt strøm – ny lader
  - entity: sensor.slm_charger_current_CHARGER_SUFFIX
    name: Målt ladestrøm – ny lader
