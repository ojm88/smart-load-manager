# One Manual card inside an existing section. Generate resolved YAML with
# smart_load_manager.get_dashboard, or replace sensor.SLM_HAN_POWER_SOURCE.
# Replace CHARGER_SUFFIX with card_suffix from the second charger Ladestatus.
type: vertical-stack
cards:
- type: markdown
  title: Laststyring hjemme – status og forklaring
  content: '{% set info = ''sensor.slm_status'' %}

    {% set loads = state_attr(info, ''controlled_loads'') or [] %}

    {% if states(info) in [''unknown'', ''unavailable''] or not loads %}

    ℹ️ **Opplysninger om laststyringen er ikke tilgjengelige akkurat nå.**

    {% else %}

    **{{ state_attr(info, ''summary'') }}**


    Forbruksgrensen for hele boligen er **{{ state_attr(info, ''consumption_limit_kwh'')
    }} kWh denne timen**.

    {% if state_attr(info, ''distribution_explanation'') %}


    {{ state_attr(info, ''distribution_explanation'') }}

    Førsteprioritet: **{{ state_attr(info, ''priority_charger'') }}**.

    {% endif %}

    {% for load in loads %}


    ### {{ load.name }}

    {{ load.explanation }}

    {% if load.power_w is not none %}

    Ladeeffekt: **{{ load.power_w | round(0) | int }} W**.

    {% endif %}

    {% if load.automatic_control and load.recommended_current_a is not none %}

    Beregnet ladestrøm: **{{ load.recommended_current_a | round(0) | int }} A**.

    {% endif %}

    {% endfor %}

    {% if state_attr(info, ''phase_advice'') %}


    💡 {{ state_attr(info, ''phase_advice'') }}

    {% endif %}

    {% endif %}'
- type: entities
  title: SLM – Boligen
  show_header_toggle: false
  entities:
  - entity: select.smart_load_manager_ojm_easee_forbruksgrense
    name: Forbruksgrense for hele huset
  - entity: select.slm_charging_mode
    name: Lademåte
  - entity: select.slm_priority_charger
    name: Førsteprioritet
- type: entities
  title: Styring – første lader
  show_header_toggle: false
  entities:
  - entity: switch.slm_auto_control
    name: Automatisk laststyring
  - entity: switch.slm_charging_pause
    name: Ladepause
  - entity: select.slm_phase_mode
    name: Fasevalg
  - entity: number.slm_manual_current
    name: Manuell ladestrøm (brukes når automatisk styring er av)
  - entity: switch.slm_schedule
    name: Tidsstyring
  - entity: time.slm_charge_start
    name: Starttid
- type: entities
  title: Målinger – første lader
  show_header_toggle: false
  entities:
  - entity: sensor.slm_charger_status
    name: Ladestatus
  - entity: sensor.slm_charger_current
    name: Strøm til bilen
  - entity: sensor.slm_charger_power
    name: Ladeeffekt
  - entity: sensor.slm_recommended_current
    name: Anbefalt ladestrøm
  - entity: sensor.slm_active_phases
    name: Faser i bruk
- type: entities
  title: Styring – ny lader
  show_header_toggle: false
  entities:
  - entity: switch.slm_auto_control_CHARGER_SUFFIX
    name: Automatisk laststyring
  - entity: switch.slm_charging_pause_CHARGER_SUFFIX
    name: Ladepause
  - entity: select.slm_phase_mode_CHARGER_SUFFIX
    name: Fasevalg
  - entity: number.slm_manual_current_CHARGER_SUFFIX
    name: Manuell ladestrøm (brukes når automatisk styring er av)
  - entity: switch.slm_schedule_CHARGER_SUFFIX
    name: Tidsstyring
  - entity: time.slm_charge_start_CHARGER_SUFFIX
    name: Starttid
- type: entities
  title: Målinger – ny lader
  show_header_toggle: false
  entities:
  - entity: sensor.slm_charger_status_CHARGER_SUFFIX
    name: Ladestatus
  - entity: sensor.slm_charger_current_CHARGER_SUFFIX
    name: Strøm til bilen
  - entity: sensor.slm_charger_power_CHARGER_SUFFIX
    name: Ladeeffekt
  - entity: sensor.slm_recommended_current_CHARGER_SUFFIX
    name: Anbefalt ladestrøm
  - entity: sensor.slm_active_phases_CHARGER_SUFFIX
    name: Faser i bruk
- type: entities
  title: Boligens målinger
  show_header_toggle: false
  entities:
  - entity: sensor.SLM_HAN_POWER_SOURCE
    name: Effekt fra strømmåleren
  - entity: sensor.energy_used_this_hour
    name: Forbruk hittil denne timen
  - entity: sensor.energy_estimate_this_hour
    name: Forventet forbruk denne timen
  - entity: sensor.slm_measurement_status
    name: Målegrunnlag
- type: history-graph
  title: Lading og strømforbruk – siste 12 timer
  hours_to_show: 12
  entities:
  - entity: sensor.slm_recommended_current
    name: Anbefalt strøm
  - entity: sensor.energy_used_this_hour
    name: Brukt
  - entity: sensor.slm_charger_current
    name: Målt ladestrøm
  - entity: sensor.energy_estimate_this_hour
    name: Timeestimat
  - entity: sensor.average_peak_hour_energy
    name: Snitt 3-timer
  - entity: sensor.slm_recommended_current_CHARGER_SUFFIX
    name: Anbefalt strøm – ny lader
  - entity: sensor.slm_charger_current_CHARGER_SUFFIX
    name: Målt ladestrøm – ny lader
